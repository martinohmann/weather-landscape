[package]
name = "weather-landscape"
version = "0.1.0"
authors = ["martinohmann <martinohmann@gmail.com>"]
repository = "https://github.com/martinohmann/weather-landscape"
edition = "2024"
resolver = "2"
rust-version = "1.85"

[[bin]]
name = "weather-landscape"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["std", "embassy", "esp-idf-hal/native", "esp-idf-svc/native", "esp-idf-sys/native", "epd-waveshare/graphics"]

pio = ["esp-idf-hal/pio", "esp-idf-svc/pio", "esp-idf-sys/pio"]
std = ["alloc", "esp-idf-hal/binstart", "esp-idf-hal/std", "esp-idf-svc/binstart", "esp-idf-svc/std", "esp-idf-sys/binstart", "esp-idf-sys/std"]
alloc = ["esp-idf-hal/alloc", "esp-idf-svc/alloc"]
nightly = ["esp-idf-hal/nightly", "esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = ["esp-idf-hal/embassy-sync", "esp-idf-svc/embassy-sync", "esp-idf-svc/critical-section", "esp-idf-svc/embassy-time-driver", "dep:embassy-time-queue-utils"]

[dependencies]
anyhow = "1.0.86"
# No embassy-executor is used, so the timer queue needs a generic (executor-independent) implementation
embassy-time-queue-utils = { version = "0.3.2", features = ["generic-queue-8"], optional = true }
embedded-graphics = "0.8.1"
embedded-svc = "0.29.0"
epd-waveshare = { git = "https://github.com/caemor/epd-waveshare", rev = "1244f035", features = ["graphics"] }
esp-idf-hal = { version = "0.47.0", default-features = false }
esp-idf-svc = { version = "0.53.0", default-features = false }
esp-idf-sys = { version = "0.38.1", default-features = false }
log = { version = "0.4", default-features = false }
toml-cfg = "0.1.3"

[build-dependencies]
embuild = "0.33.7"
toml-cfg = "0.1.3"
